<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prestige Compagnie</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0f1f;--pn:#141831;--pn2:#1c2142;--ln:#2c3360;--tx:#eef0f8;--mu:#9299b8;--ac:#d4b055;--rose:#a51c3c}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.55 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','DM Sans',sans-serif;letter-spacing:-.01em;line-height:1.15}
aside{width:238px;background:var(--pn);border-right:1px solid var(--ln);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;gap:3px;padding:16px 12px;overflow:auto;z-index:5}
.brand{font:800 1.25rem 'Bricolage Grotesque';padding:4px 10px 14px;display:flex;gap:10px;align-items:center}
.brand img,.lgo img{max-width:100%;max-height:100%;object-fit:contain}
.brand img{width:40px;height:40px;flex:none}.ni{width:22px;height:22px;flex:none}
.nv{padding:9px 12px;border-radius:10px;color:var(--mu);cursor:pointer;display:flex;gap:10px;font-weight:500}
.nv:hover{background:var(--pn2);color:var(--tx)}
.nv.on{background:var(--pn2);color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
.sp{flex:1}
.me{padding:10px;border-top:1px solid var(--ln);margin-top:8px;font-size:.85rem}
.me b{display:block}
main{margin-left:238px;flex:1;padding:32px clamp(16px,4vw,48px);min-width:0;max-width:1200px}
.ph{display:flex;gap:16px;align-items:center;margin-bottom:26px}
.lgo{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex:none}.lgo img{width:100%;height:100%}.ban{background:#fff;border-radius:20px;padding:10px 18px;border-bottom:5px solid var(--rose);max-width:760px;margin-bottom:22px}.ban img{width:100%;display:block}
h2{font-size:2rem}.st{margin:30px 0 14px;font-size:1.25rem}
.mu,small{color:var(--mu)}
.hero{padding:44px 0 30px;max-width:640px}.hero h1{font-size:clamp(2.2rem,5vw,3.4rem);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.two{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:18px;align-items:start}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card.f{border-top:4px solid var(--ac)}
.card .lgo{width:64px;height:64px}
.pat{border-left:4px solid var(--ac);margin-bottom:10px}.pat.off{opacity:.55;border-left-color:var(--ln)}
.kpi{font:800 2rem 'Bricolage Grotesque'}
label{font-size:.8rem;color:var(--mu);margin-top:4px;display:block}
input,select{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;color:var(--tx);font:inherit}
input:focus,select:focus,.btn:focus-visible,.nv:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.chk{max-height:170px;overflow:auto;border:1px solid var(--ln);border-radius:10px;padding:6px 10px;background:var(--bg)}
.chk label{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:.9rem;margin:3px 0}.chk input{width:auto}
.btn{background:var(--ac);color:#111;border:0;border-radius:10px;padding:10px 16px;font:600 .9rem 'DM Sans';cursor:pointer;margin-top:8px}
.btn.g{background:var(--pn2);color:var(--tx);border:1px solid var(--ln)}.btn.s{padding:5px 10px;margin:0;font-size:.8rem}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--ac) 22%,transparent);color:var(--ac);font-size:.78rem;font-weight:600}
.row{flex-direction:row;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:130px}.row .btn{flex:none}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;margin-top:10px}
table{width:100%;border-collapse:collapse;background:var(--pn)}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--ln);font-size:.9rem}th{color:var(--mu);font-weight:500;background:var(--pn2)}
.plus{color:#4ade80}.moins{color:#f87171}
#mv{position:relative;height:calc(100vh - 230px);min-height:380px;overflow:hidden;border-radius:16px;border:1px solid var(--ln);background:#7c9cc4;touch-action:none;cursor:grab}
#mw{position:absolute;left:0;top:0;width:2000px;height:2000px;transform-origin:0 0}
#mw img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.mk{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%) scale(var(--k,1));cursor:pointer;filter:drop-shadow(0 2px 4px #000a)}.mk img{width:100%;height:100%;display:block}
.menu-c{margin-bottom:22px}.menu-c div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--ln)}
.login{max-width:380px;margin:8vh auto}
@media(max-width:820px){body{display:block}aside{position:static;width:auto;flex-direction:row;flex-wrap:wrap}.brand,.sp{display:none}main{margin:0}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" style="display:contents"></div>
<script>
/* ===== DONNÉES =====
   Couche de stockage isolée : aujourd’hui localStorage (données propres à chaque navigateur).
   Pour partager entre tous les salariés, on remplacera load()/persist() par Firebase/Supabase. */
const KEY='prestige_v2';
const F={
 BRB:{n:'Brigade Rapide de Balisage',s:'BRB',c:'#e4ec3b',i:'img/brb.png',d:'Balisage et sécurisation rapide des zones d’intervention.'},
 RD:{n:'La Roue des Délices',s:'La Roue des Délices',c:'#3fb0bf',i:'img/rd.png',d:'Douceurs, repas et boissons préparés sur place, partout en ville.'},
 PR:{n:'Le Petit Reporter',s:'Le Petit Reporter',c:'#dc7a72',i:'img/pr.png',d:'L’actualité de la ville, racontée par ceux qui la vivent.'}};
const R={admin:['Admin',5],president:['Président',4],vp:['Vice-Président',3],directeur:['Directeur',2],membre:['Membre',1]};
const IC={home:'🏠',menu:'🍽️',map:'🗺️',adm:'📋',tre:'💰',ges:'⚙️'};
const seed=()=>({users:[{id:'S.Mouveau',name:'Samuel Mouveau',pin:'9999',role:'admin',f:'',grade:'Administrateur',medals:[]}],
 patrols:[],events:[],tx:[],news:[],
 veh:{BRB:['BRB-01 · Van de balisage','BRB-02 · Fourgon'],RD:['RD-01 · Food truck'],PR:['PR-01 · SUV presse']},
 menu:[{n:'Muffin chocolat',p:5,c:'Douceurs'},{n:'Café chaud',p:3,c:'Boissons'}],logos:{}});
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch(x){return seed()}};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(x){alert('Stockage plein : réduis la taille des logos.')}};
let D=load(),U=null,P='home',placing=false;
try{U=D.users.find(u=>u.id==sessionStorage.s)||null}catch(x){}
const save=()=>{persist();render()};

/* ===== OUTILS ===== */
const $=i=>document.getElementById(i),v=i=>$(i).value.trim();
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const lvl=()=>U?R[U.role][1]:0;
const canD=f=>lvl()>=3||(lvl()==2&&U.f==f);
const canV=f=>lvl()>=3||(!!U&&U.f==f);
const usr=id=>D.users.find(u=>u.id==id),nm=id=>usr(id)?.name||id;
const bal=f=>D.tx.filter(t=>!f||t.f==f).reduce((a,t)=>a+t.a,0);
const money=n=>n.toLocaleString('fr-FR')+' $';
const lg=k=>`<img src="${D.logos[k]||(k=='main'?'img/prestige.png':F[k].i)}" alt="">`;
const go=p=>{P=p;placing=false;render();scrollTo(0,0)};
const del=(a,id)=>{if(confirm('Supprimer cet élément ?')){D[a]=D[a].filter(x=>x.id!=id);save()}};
const today=()=>new Date().toISOString().slice(0,10);

/* ===== NAVIGATION ===== */
function nav(){
 const it=[['home',U?'Tableau de bord':'Accueil'],['menu','Menu de la Roue des Délices']];
 if(U){Object.keys(F).filter(canV).forEach(k=>it.push([k,F[k].s]));it.push(['map','Carte interactive']);
  if(lvl()>=2)it.push(['adm','Administratif'],['tre','Trésorerie']);if(lvl()>=5)it.push(['ges','Gestion'])}
 else it.push(['login','Connexion salariés']);
 return it.map(([k,t])=>`<a class="nv${P==k?' on':''}" tabindex=0 onclick="go('${k}')" style="--ac:${F[k]?.c||'#d4b055'}">${F[k]?`<img class=ni src="${F[k].i}" alt="">`:IC[k]||'🔑'} ${t}</a>`).join('')}

function render(){
 if(U)U=usr(U.id)||null;
 const need={map:1,adm:2,tre:2,ges:5};
 if(P!='login'&&P!='menu'&&P!='home'&&((F[P]&&!canV(P))||(need[P]&&lvl()<need[P])))P=U?'home':'login';
 $('app').innerHTML=`<aside><div class=brand>${lg('main')}Prestige Compagnie</div>${nav()}<div class=sp></div>
 ${U?`<div class=me><b>${e(U.name)}</b><span class=mu>${R[U.role][0]}${U.f?' · '+F[U.f].s:''}</span><br><button class="btn g s" style="margin-top:8px" onclick="logout()">Se déconnecter</button></div>`:''}</aside>
 <main style="--ac:${F[P]?F[P].c:'#d4b055'}">${(PG[P]||PG.home)()}</main>`;
 if(P=='map')mapInit()}

/* ===== PAGES ===== */
const PG={
home(){
 const mine=U?.medals||[];
 return `<div class=ban><img src="img/banniere.png" alt="Prestige Compagnie"></div><div class=hero style="padding-top:8px"><h1>${U?`Bonjour ${e(U.name.split(' ')[0])}.`:'Trois filiales, une seule ville.'}</h1>
 <p class=mu>${U?`Voici l’activité de la compagnie.`:'Trois filiales au service de la ville : balisage, restauration et presse. Consulte nos activités et le menu de la Roue des Délices.'}</p></div>
 <div class=grid>${Object.entries(F).map(([k,f])=>`<div class="card f" style="--ac:${f.c}"><div class=lgo>${lg(k)}</div><h3>${f.n}</h3><p class=mu>${f.d}</p>
 ${canV(k)?`<button class=btn onclick="go('${k}')">Ouvrir la page</button>`:k=='RD'?`<button class="btn g" onclick="go('menu')">Voir le menu</button>`:''}</div>`).join('')}</div>
 ${U?`<h3 class=st>Annonces</h3>${D.news.slice().reverse().map(n=>`<div class=card style="margin-bottom:10px"><b>${e(n.t)}</b><span>${e(n.x)}</span><small>${n.d} · ${e(nm(n.by))}</small></div>`).join('')||'<p class=mu>Aucune annonce pour le moment.</p>'}
 <h3 class=st>Mes médailles</h3><div class=grid>${mine.map(m=>`<div class=card><span style="font-size:1.6rem">🏅</span><b>${e(m.m)}</b><small>${e(m.e)} · ${m.d}</small></div>`).join('')||'<p class=mu>Aucune médaille reçue pour l’instant.</p>'}</div>`:''}`},

menu(){
 const cats=[...new Set(D.menu.map(m=>m.c))];
 return `<div class=ph><div class=lgo style="--ac:${F.RD.c}">${lg('RD')}</div><div><h2>Menu de la Roue des Délices</h2><p class=mu>Prix en dollars, servis au food truck.</p></div></div>
 ${cats.map(c=>`<div class=menu-c><h3>${e(c)}</h3>${D.menu.filter(m=>m.c==c).map(m=>`<div><span>${e(m.n)}</span><b>${m.p} $</b></div>`).join('')}</div>`).join('')||'<p class=mu>Le menu arrive bientôt.</p>'}`},

login(){return `<form class="card login" onsubmit="doLogin(event)"><div class=lgo style="width:110px;height:110px;margin:0 auto 6px">${lg('main')}</div><h2>Connexion</h2><p class=mu>Espace réservé aux salariés.</p>
 <label>Identifiant</label><input id=li placeholder="Ex : S.Mouveau" autocomplete=username required>
 <label>Code PIN</label><input id=lp type=password autocomplete=current-password required><button class=btn>Se connecter</button></form>`},

map(){
 const ev=D.events.filter(x=>x.x!=null).sort((a,b)=>b.d.localeCompare(a.d));
 const dir=lvl()>=2;
 return `<div class=ph><h2>Carte interactive</h2></div>
 <div class="card row" style="margin-bottom:12px;align-items:center"><span class=mu style="flex:3">Molette ou pincement pour zoomer, glisser pour se déplacer. ${dir?'Clique « Poser un événement » puis un point de la carte.':''}</span>
 ${dir?`<button class="btn${placing?'':' g'}" onclick="placing=!placing;render()">${placing?'Annuler la pose':'📍 Poser un événement'}</button>`:''}
 <button class="btn g" onclick="mapFit()">Recentrer</button></div>
 <div class=two style="grid-template-columns:1fr 260px"><div id=mv><div id=mw><img src="map.jpg" alt="Carte" onerror="this.style.display='none'">
 ${ev.map(x=>`<div class=mk style="left:${x.x}%;top:${x.y}%" title="${e(x.t)}" onpointerup="info('${x.id}')"><img src="${F[x.f].i}" alt=""></div>`).join('')}</div></div>
 <div id=inf class=card><h4>Événements</h4>${ev.map(x=>`<a class=nv style="--ac:${F[x.f].c}" onclick="info('${x.id}')"><img class=ni src="${F[x.f].i}" alt=""> ${e(x.t)}</a>`).join('')||'<p class=mu>Aucun événement posé.</p>'}</div></div>`},

adm(){
 return `<div class=ph><h2>Administratif</h2></div><div class=grid>${Object.entries(F).filter(([k])=>canD(k)).map(([k,f])=>`<div class="card f" style="--ac:${f.c}"><h3>${f.s}</h3>
 <span>${D.users.filter(u=>u.f==k).length} membres</span><span>${D.patrols.filter(p=>p.f==k&&p.st=='En service').length} patrouille(s) en service</span>
 <span>${D.events.filter(x=>x.f==k).length} événement(s)</span><b>Solde : ${money(bal(k))}</b></div>`).join('')}</div>
 <h3 class=st>Publier une annonce</h3><form class=card onsubmit="addNews(event)"><label>Titre</label><input id=nt required><label>Message</label><input id=nx required><button class=btn>Publier</button></form>
 ${D.news.slice().reverse().map(n=>`<div class="card row" style="margin-top:10px"><div><b>${e(n.t)}</b><br><small>${n.d} · ${e(nm(n.by))}</small></div><button class="btn g s" onclick="del('news','${n.id}')">Supprimer</button></div>`).join('')}`},

tre(){
 const fs=lvl()>=3?Object.keys(F):[U.f].filter(Boolean);
 const tx=D.tx.filter(t=>fs.includes(t.f)).sort((a,b)=>b.t-a.t).slice(0,80);
 return `<div class=ph><h2>Trésorerie</h2></div><div class=grid>
 ${lvl()>=3?`<div class="card f"><span class=mu>Solde global</span><div class=kpi>${money(bal())}</div></div>`:''}
 ${fs.map(k=>`<div class="card f" style="--ac:${F[k].c}"><span class=mu>${F[k].s}</span><div class=kpi>${money(bal(k))}</div></div>`).join('')}</div>
 <h3 class=st>Nouvelle opération</h3><form class="card row" onsubmit="addTx(event)">
 <div><label>Filiale</label><select id=xf>${fs.map(k=>`<option value=${k}>${F[k].s}</option>`).join('')}</select></div>
 <div><label>Type</label><select id=xs><option value=1>Recette</option><option value=-1>Dépense</option></select></div>
 <div><label>Montant</label><input id=xa type=number min=0 step=any required></div><div style="flex:2"><label>Libellé</label><input id=xl required></div><button class=btn>Enregistrer</button></form>
 <div class=tw><table><tr><th>Date</th><th>Filiale</th><th>Libellé</th><th>Auteur</th><th>Montant</th><th></th></tr>
 ${tx.map(t=>`<tr><td>${t.d}</td><td>${F[t.f].s}</td><td>${e(t.l)}</td><td>${e(nm(t.by))}</td><td class="${t.a>=0?'plus':'moins'}">${t.a>=0?'+':''}${money(t.a)}</td><td>${lvl()>=3?`<a class=mu style="cursor:pointer" onclick="del('tx','${t.id}')">✕</a>`:''}</td></tr>`).join('')||'<tr><td colspan=6 class=mu>Aucune opération.</td></tr>'}</table></div>`},

ges(){
 return `<div class=ph><h2>Gestion</h2></div><h3 class=st style="margin-top:0">Créer un compte</h3>
 <form class="card row" onsubmit="addUser(event)"><div><label>Nom complet</label><input id=un oninput="$('ui').value=genId(this.value)" required></div>
 <div><label>Identifiant</label><input id=ui required></div><div><label>PIN</label><input id=up required></div>
 <div><label>Rôle</label><select id=ur>${Object.entries(R).map(([k,r])=>`<option value=${k}>${r[0]}</option>`).join('')}</select></div>
 <div><label>Filiale</label><select id=uf><option value="">Aucune</option>${Object.entries(F).map(([k,f])=>`<option value=${k}>${f.s}</option>`).join('')}</select></div>
 <div><label>Grade</label><input id=ug placeholder="Ex : Agent"></div><button class=btn>Créer</button></form>
 <div class=tw><table><tr><th>Nom</th><th>ID</th><th>Rôle</th><th>Filiale</th><th>Grade</th><th></th></tr>
 ${D.users.map(u=>`<tr><td>${e(u.name)}</td><td>${e(u.id)}</td><td><select onchange="setRole('${u.id}',this.value)">${Object.entries(R).map(([k,r])=>`<option value=${k}${k==u.role?' selected':''}>${r[0]}</option>`).join('')}</select></td>
 <td>${u.f?F[u.f].s:'—'}</td><td>${e(u.grade)}</td><td><button class="btn g s" onclick="chPin('${u.id}')">PIN</button> ${u.id!=U.id?`<button class="btn g s" onclick="delUser('${u.id}')">Supprimer</button>`:''}</td></tr>`).join('')}</table></div>
 <h3 class=st>Logos</h3><div class=grid>${['main',...Object.keys(F)].map(k=>`<div class=card><b>${k=='main'?'Prestige Compagnie':F[k].n}</b><div class=lgo>${lg(k)}</div><input type=file accept="image/*" onchange="setLogo('${k}',this)">${D.logos[k]?`<button class="btn g s" onclick="delete D.logos['${k}'];save()">Retirer</button>`:''}</div>`).join('')}</div>
 <h3 class=st>Sauvegarde</h3><div class="card row"><button class=btn onclick="exportJ()">Exporter les données</button><div><label>Importer un fichier</label><input type=file accept=.json onchange="importJ(this)"></div></div>`}
};
Object.keys(F).forEach(k=>PG[k]=()=>fil(k));

function fil(k){
 const f=F[k],cd=canD(k),mem=D.users.filter(u=>u.f==k),ps=D.patrols.filter(p=>p.f==k).sort((a,b)=>b.t-a.t),ev=D.events.filter(x=>x.f==k).sort((a,b)=>b.d.localeCompare(a.d));
 return `<div class=ph><div class=lgo>${lg(k)}</div><div><h2>${f.n}</h2><p class=mu>${f.d}</p></div></div>
 <h3 class=st style="margin-top:0">Fiches de patrouille</h3><div class=two>
 <form class=card onsubmit="addPatrol(event,'${k}')"><h4>Nouvelle fiche</h4><label>Indicatif</label><input id=pc required placeholder="Ex : ${f.s.slice(0,3).toUpperCase()}-Alpha 1">
 <label>Véhicule</label><select id=pv>${D.veh[k].map(x=>`<option>${e(x)}</option>`).join('')}</select>
 <label>Effectif</label><div class=chk>${mem.map(u=>`<label><input type=checkbox class=pm value="${u.id}">${e(u.name)} <small>${e(u.grade)}</small></label>`).join('')||'<span class=mu>Aucun membre dans cette filiale.</span>'}</div>
 <label>Notes</label><input id=pn><button class=btn>Créer la fiche</button></form>
 <div>${ps.map(p=>`<div class="card pat${p.st=='En service'?'':' off'}"><div style="display:flex;justify-content:space-between;gap:8px"><h4>${e(p.c)}</h4><span class=pill>${p.st}</span></div>
 <span>🚗 ${e(p.veh)}</span><span>👥 ${p.crew.map(i=>e(nm(i))).join(', ')}</span>${p.n?`<span class=mu>${e(p.n)}</span>`:''}
 <small>${new Date(p.t).toLocaleString('fr-FR')} · ${e(nm(p.by))}</small>
 <div><button class="btn g s" onclick="tgl('${p.id}')">${p.st=='En service'?'Terminer':'Reprendre'}</button> ${cd||p.by==U.id?`<button class="btn g s" onclick="del('patrols','${p.id}')">Supprimer</button>`:''}</div></div>`).join('')||'<p class=mu>Aucune fiche. Crée la première depuis le formulaire.</p>'}</div></div>
 <h3 class=st>Effectif</h3><div class=tw><table><tr><th>Nom</th><th>Rôle</th><th>Grade</th><th>Médailles</th></tr>${mem.map(u=>`<tr><td>${e(u.name)}</td><td>${R[u.role][0]}</td><td>${e(u.grade)}</td><td>${u.medals.length?'🏅 '+u.medals.length:'—'}</td></tr>`).join('')}</table></div>
 <h3 class=st>Événements et médailles</h3>
 ${cd?`<form class=card onsubmit="addEvent(event,'${k}')"><div class=row style="display:flex;gap:10px"><div style="flex:2"><label>Événement</label><input id=et required></div><div><label>Date</label><input id=ed type=date value="${today()}" required></div><div><label>Médaille décernée</label><input id=em placeholder="Facultatif"></div></div>
 <label>Récompensés</label><div class=chk>${mem.map(u=>`<label><input type=checkbox class=ea value="${u.id}">${e(u.name)}</label>`).join('')}</div><button class=btn>Créer l’événement</button>${k=='BRB'?'<small>Pour le placer sur la carte, utilise « Poser un événement » dans Carte interactive.</small>':''}</form>`:''}
 ${ev.map(x=>`<div class="card" style="margin-top:10px"><b>${e(x.t)}</b><small>${x.d}${x.m?' · 🏅 '+e(x.m):''}${x.x!=null?' · 📍 sur la carte':''}</small>${x.aw?.length?`<span>${x.aw.map(i=>e(nm(i))).join(', ')}</span>`:''}${cd?`<div><button class="btn g s" onclick="del('events','${x.id}')">Supprimer</button></div>`:''}</div>`).join('')||'<p class=mu style="margin-top:10px">Aucun événement.</p>'}
 ${cd?`<h3 class=st>Véhicules</h3><div class="card row">${D.veh[k].map((x,i)=>`<span class=pill>${e(x)} <a style="cursor:pointer" onclick="D.veh['${k}'].splice(${i},1);save()">✕</a></span>`).join('')}
 <form onsubmit="addVeh(event,'${k}')" style="display:flex;gap:8px;min-width:100%"><input id=vn placeholder="Nouveau véhicule" required><button class=btn style="margin:0">Ajouter</button></form></div>`:''}
 ${k=='RD'&&cd?`<h3 class=st>Menu</h3><form class="card row" onsubmit="addMenu(event)"><div style="flex:2"><label>Produit</label><input id=mn required></div><div><label>Prix</label><input id=mp type=number step=any required></div><div><label>Catégorie</label><input id=mc value="Douceurs" required></div><button class=btn>Ajouter</button></form>
 <div class=tw><table>${D.menu.map((m,i)=>`<tr><td>${e(m.n)}</td><td>${e(m.c)}</td><td>${m.p} $</td><td><a style="cursor:pointer" onclick="D.menu.splice(${i},1);save()">✕</a></td></tr>`).join('')}</table></div>`:''}`}

/* ===== ACTIONS ===== */
function doLogin(ev){ev.preventDefault();const u=D.users.find(x=>x.id.toLowerCase()==v('li').toLowerCase()&&x.pin==v('lp'));
 if(!u)return alert('Identifiant ou PIN incorrect.');U=u;try{sessionStorage.s=u.id}catch(x){}go('home')}
function logout(){U=null;try{delete sessionStorage.s}catch(x){}go('home')}
function addPatrol(ev,k){ev.preventDefault();const crew=[...document.querySelectorAll('.pm:checked')].map(c=>c.value);
 if(!crew.length)return alert('Sélectionne au moins un membre d’effectif.');
 D.patrols.push({id:uid(),f:k,c:v('pc'),veh:v('pv'),crew,n:v('pn'),st:'En service',t:Date.now(),by:U.id});save()}
function tgl(id){const p=D.patrols.find(x=>x.id==id);p.st=p.st=='En service'?'Terminée':'En service';save()}
function addEvent(ev,k){ev.preventDefault();const aw=[...document.querySelectorAll('.ea:checked')].map(c=>c.value),m=v('em'),x={id:uid(),f:k,t:v('et'),d:v('ed'),m,aw};
 D.events.push(x);if(m)aw.forEach(i=>usr(i).medals.push({m,e:x.t,d:x.d}));save()}
function addVeh(ev,k){ev.preventDefault();D.veh[k].push(v('vn'));save()}
function addMenu(ev){ev.preventDefault();D.menu.push({n:v('mn'),p:parseFloat(v('mp')),c:v('mc')});save()}
function addNews(ev){ev.preventDefault();D.news.push({id:uid(),t:v('nt'),x:v('nx'),d:new Date().toLocaleDateString('fr-FR'),by:U.id});save()}
function addTx(ev){ev.preventDefault();const f=v('xf');if(!canD(f))return;
 D.tx.push({id:uid(),f,a:parseFloat(v('xa'))*parseInt(v('xs')),l:v('xl'),d:new Date().toLocaleDateString('fr-FR'),by:U.id,t:Date.now()});save()}
const genId=n=>{const p=n.trim().split(/\s+/);return p[0]?p[0][0].toUpperCase()+(p.length>1?'.'+p.slice(1).join(''):''):''};
function addUser(ev){ev.preventDefault();const id=v('ui');if(usr(id))return alert('Cet identifiant existe déjà.');
 D.users.push({id,name:v('un'),pin:v('up'),role:v('ur'),f:v('uf'),grade:v('ug')||'Membre',medals:[]});save()}
function setRole(id,r){usr(id).role=r;save()}
function chPin(id){const p=prompt('Nouveau PIN pour '+id);if(p){usr(id).pin=p;save()}}
function delUser(id){if(confirm('Supprimer le compte '+id+' ?')){D.users=D.users.filter(u=>u.id!=id);save()}}
function setLogo(k,inp){const fl=inp.files[0];if(!fl)return;const im=new Image();im.onload=()=>{const s=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.logos[k]=c.toDataURL('image/png');save()};im.src=URL.createObjectURL(fl)}
function exportJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='prestige-sauvegarde-'+today()+'.json';a.click()}
function importJ(inp){const r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save()}catch(x){alert('Fichier invalide.')}};r.readAsText(inp.files[0])}

/* ===== CARTE (zoom + déplacement) ===== */
let mS=1,mX=0,mY=0;
function mapFit(){const v=$('mv');mS=Math.min(v.clientWidth,v.clientHeight)/2000;mX=(v.clientWidth-2000*mS)/2;mY=(v.clientHeight-2000*mS)/2;mApply()}
function mApply(){const w=$('mw');w.style.transform=`translate(${mX}px,${mY}px) scale(${mS})`;w.style.setProperty('--k',Math.min(1,.6/mS*.5+.2))}
function info(id){const x=D.events.find(y=>y.id==id);if(!x||moved>6)return;
 $('inf').innerHTML=`<h4>${e(x.t)}</h4><small>${F[x.f].n} · ${x.d}</small>${x.m?`<span>🏅 ${e(x.m)}</span>`:''}${x.aw?.length?`<span>${x.aw.map(i=>e(nm(i))).join(', ')}</span>`:''}
 <button class="btn g s" onclick="render()">Retour à la liste</button>${canD(x.f)?`<button class="btn g s" onclick="del('events','${x.id}')">Supprimer</button>`:''}`}
let moved=0;
function mapInit(){const v=$('mv');let drag=null,pts={},pd=0;mapFit();
 v.onwheel=ev=>{ev.preventDefault();zoom(ev.clientX,ev.clientY,ev.deltaY<0?1.2:1/1.2)};
 const zoom=(cx,cy,f)=>{const r=v.getBoundingClientRect(),ns=Math.max(Math.min(v.clientWidth,v.clientHeight)/2000*.8,Math.min(3,mS*f)),mx=cx-r.left,my=cy-r.top;mX=mx-(mx-mX)*ns/mS;mY=my-(my-mY)*ns/mS;mS=ns;mApply()};
 v.onpointerdown=ev=>{v.setPointerCapture(ev.pointerId);pts[ev.pointerId]=ev;moved=0;drag={x:ev.clientX,y:ev.clientY};pd=0};
 v.onpointermove=ev=>{if(!pts[ev.pointerId])return;const ids=Object.keys(pts);
  if(ids.length==2){const o=pts[ids.find(i=>i!=ev.pointerId)],d=Math.hypot(ev.clientX-o.clientX,ev.clientY-o.clientY);if(pd)zoom((ev.clientX+o.clientX)/2,(ev.clientY+o.clientY)/2,d/pd);pd=d;pts[ev.pointerId]=ev;moved=99;return}
  pts[ev.pointerId]=ev;mX+=ev.clientX-drag.x;mY+=ev.clientY-drag.y;moved+=Math.abs(ev.clientX-drag.x)+Math.abs(ev.clientY-drag.y);drag={x:ev.clientX,y:ev.clientY};mApply()};
 v.onpointerup=ev=>{delete pts[ev.pointerId];pd=0;if(moved<6&&placing&&!ev.target.closest('.mk')){const r=v.getBoundingClientRect(),x=(ev.clientX-r.left-mX)/mS/20,y=(ev.clientY-r.top-mY)/mS/20;
  const t=prompt('Titre de l’événement ?');if(t){const f=lvl()>=3||U.f=='BRB'?'BRB':U.f;D.events.push({id:uid(),f,t,d:today(),m:'',aw:[],x:+x.toFixed(2),y:+y.toFixed(2)})}placing=false;save()}}}
render();
</script>
</body>
