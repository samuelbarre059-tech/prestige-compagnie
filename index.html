<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prestige Compagnie</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0f1f;--pn:#141831;--pn2:#1c2142;--ln:#2c3360;--tx:#eef0f8;--mu:#9299b8;--ac:#d4b055;--rose:#a51c3c}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.55 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','DM Sans',sans-serif;letter-spacing:-.01em;line-height:1.15}
aside{width:238px;background:var(--pn);border-right:1px solid var(--ln);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;gap:3px;padding:16px 12px;overflow:auto;z-index:5}
.brand{font:800 1.25rem 'Bricolage Grotesque';padding:4px 10px 14px;display:flex;gap:10px;align-items:center}
.brand img,.lgo img{max-width:100%;max-height:100%;object-fit:contain}
.brand img{width:40px;height:40px;flex:none}.ni{width:22px;height:22px;flex:none}
.nv{padding:9px 12px;border-radius:10px;color:var(--mu);cursor:pointer;display:flex;gap:10px;font-weight:500}
.nv:hover{background:var(--pn2);color:var(--tx)}
.nv.on{background:var(--pn2);color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
.sp{flex:1}
.me{padding:10px;border-top:1px solid var(--ln);margin-top:8px;font-size:.85rem}
.me b{display:block}
main{margin-left:238px;flex:1;padding:32px clamp(16px,4vw,48px);min-width:0;max-width:1200px}
.ph{display:flex;gap:16px;align-items:center;margin-bottom:26px}
.lgo{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex:none}.lgo img{width:100%;height:100%}.ban{background:#fff;border-radius:20px;padding:10px 18px;border-bottom:5px solid var(--rose);max-width:760px;margin-bottom:22px}.ban img{width:100%;display:block}
h2{font-size:2rem}.st{margin:30px 0 14px;font-size:1.25rem}
.mu,small{color:var(--mu)}
.hero{padding:44px 0 30px;max-width:640px}.hero h1{font-size:clamp(2.2rem,5vw,3.4rem);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.two{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:18px;align-items:start}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card.f{border-top:4px solid var(--ac)}
.card .lgo{width:64px;height:64px}
.pat{border-left:4px solid var(--ac);margin-bottom:10px}.pat.off{opacity:.55;border-left-color:var(--ln)}
.kpi{font:800 2rem 'Bricolage Grotesque'}
label{font-size:.8rem;color:var(--mu);margin-top:4px;display:block}
input,select{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;color:var(--tx);font:inherit}
input:focus,select:focus,.btn:focus-visible,.nv:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.chk{max-height:170px;overflow:auto;border:1px solid var(--ln);border-radius:10px;padding:6px 10px;background:var(--bg)}
.chk label{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:.9rem;margin:3px 0}.chk input{width:auto}
.btn{background:var(--ac);color:#111;border:0;border-radius:10px;padding:10px 16px;font:600 .9rem 'DM Sans';cursor:pointer;margin-top:8px}
.btn.g{background:var(--pn2);color:var(--tx);border:1px solid var(--ln)}.btn.s{padding:5px 10px;margin:0;font-size:.8rem}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--ac) 22%,transparent);color:var(--ac);font-size:.78rem;font-weight:600}
.row{flex-direction:row;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:130px}.row .btn{flex:none}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;margin-top:10px}
table{width:100%;border-collapse:collapse;background:var(--pn)}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--ln);font-size:.9rem}th{color:var(--mu);font-weight:500;background:var(--pn2)}
.plus{color:#4ade80}.moins{color:#f87171}
#mv{position:relative;height:calc(100vh - 230px);min-height:380px;overflow:hidden;border-radius:16px;border:1px solid var(--ln);background:#7c9cc4;touch-action:none;cursor:grab}
#mw{position:absolute;left:0;top:0;width:2000px;height:2000px;transform-origin:0 0}
#mw img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.mk{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%) scale(var(--k,1));cursor:pointer;filter:drop-shadow(0 2px 4px #000a)}.mk img{width:100%;height:100%;display:block}
.mi{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--ln)}.mi:last-child{border:0}.mi b{color:var(--ac);white-space:nowrap}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mat{background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.mimg{width:72px;height:72px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:2rem;overflow:hidden}.mimg img{width:100%;height:100%;object-fit:contain}
.mact{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:-6px 0 22px;border-bottom:1px solid var(--ln)}
.tb{padding:10px 16px;cursor:pointer;color:var(--mu);border-bottom:3px solid transparent;font-weight:500;margin-bottom:-1px}.tb:hover{color:var(--tx)}.tb.on{color:var(--tx);border-bottom-color:var(--ac)}
.login{max-width:380px;margin:8vh auto}
@media(max-width:820px){body{display:block}aside{position:static;width:auto;flex-direction:row;flex-wrap:wrap}.brand,.sp{display:none}main{margin:0}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" style="display:contents"></div>
<script src="firebase-config.js"></script>
<script>
/* ===== DONNÉES =====
   Couche de stockage isolée : aujourd’hui localStorage (données propres à chaque navigateur).
   Pour partager entre tous les salariés, on remplacera load()/persist() par Firebase/Supabase. */
const KEY='prestige_v2';
const F={
 BRB:{n:'Brigade Rapide de Balisage',s:'BRB',c:'#e4ec3b',i:'img/brb.png',d:'Balisage et sécurisation rapide des zones d’intervention.'},
 RD:{n:'La Roue des Délices',s:'La Roue des Délices',c:'#3fb0bf',i:'img/rd.png',d:'Douceurs, repas et boissons préparés sur place, partout en ville.'},
 PR:{n:'Le Petit Reporter',s:'Le Petit Reporter',c:'#dc7a72',i:'img/pr.png',d:'L’actualité de la ville, racontée par ceux qui la vivent.'}};
const R={president:['Président',4],vp:['Vice-Président',3],directeur:['Directeur',2],salarie:['Salarié',1]};
const IC={home:'🏠',menu:'🍽️',map:'🗺️',adm:'📋',tre:'💰',ges:'⚙️',jnl:'📜'};
const seed=()=>({users:[{id:'S.Mouveau',name:'Samuel Mouveau',pin:'9999',role:'salarie',admin:true,fs:[],dirs:[],grade:'Administrateur'}],
 patrols:[],events:[],tx:[],news:[],maps:[],medals:[],sales:[],logs:[],gear:[],
 veh:{BRB:['BRB-01 · Van de balisage','BRB-02 · Fourgon'],RD:['RD-01 · Food truck'],PR:['PR-01 · SUV presse']},
 menu:[{n:'Muffin chocolat',p:5,c:'Douceurs'},{n:'Café chaud',p:3,c:'Boissons'}],logos:{}});
/* Compatibilité anciens comptes : admin/membre/f -> admin(bool)/salarie/fs[] */
const norm=u=>{u={...u};if(u.role=='admin'){u.admin=true;u.role='salarie'}if(u.role=='membre')u.role='salarie';
 u.fs=u.fs||(u.f?[u.f]:[]);u.dirs=u.dirs||(u.role=='directeur'&&u.f?[u.f]:[]);if(u.role=='directeur')u.dirs.forEach(k=>{if(!u.fs.includes(k))u.fs.push(k)});delete u.f;delete u.medals;return u};
const load=()=>{let d;try{d=JSON.parse(localStorage.getItem(KEY))}catch(x){}d=d||seed();d.users=d.users.map(norm);d.maps=d.maps||[];d.medals=d.medals||[];d.sales=d.sales||[];d.logs=d.logs||[];d.gear=d.gear||[];return d};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(x){alert('Stockage plein : réduis la taille des logos.')}};
const FB_ON=!!window.FIREBASE_CONFIG;let SETUP=false,AUTHID=null,pending=false,mKeep=false,curMap='base',editU=null,FT='pat',jf='',editM=null,editG=null;
let D=FB_ON?{users:[],patrols:[],events:[],tx:[],news:[],maps:[],medals:[],sales:[],logs:[],gear:[],veh:{BRB:[],RD:[],PR:[]},menu:[],logos:{}}:load(),U=null,P='home',placing=false;
if(!FB_ON)try{U=D.users.find(u=>u.id==sessionStorage.s)||null}catch(x){}
const save=()=>{FB_ON?window.FBX?.sync():persist();render()};
/* Rafraîchit sans casser un formulaire en cours de saisie */
function softRender(){const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)&&a.closest('main'))pending=true;else render()}
document.addEventListener('focusout',()=>{if(pending)setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|SELECT/.test(a.tagName))){pending=false;render()}},1200)});
const medName=id=>D.medals.find(m=>m.id==id)?.name||id;
const medImg=m=>m.img?`<img src="${m.img}" alt="" style="width:56px;height:56px;object-fit:contain;flex:none">`:`<span style="font-size:2.2rem">🏅</span>`;
const medals=id=>D.events.filter(x=>x.m&&(x.aw||[]).includes(id)).map(x=>{const m=D.medals.find(y=>y.id==x.m)||{};return{n:m.name||x.m,desc:m.desc||'',img:m.img||'',e:x.t,d:x.d}});

/* ===== OUTILS ===== */
const $=i=>document.getElementById(i),v=i=>$(i).value.trim();
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const lvl=()=>U?(U.admin?5:R[U.role]?.[1]||1):0;
const inF=(u,k)=>(u.fs||[]).includes(k);
const canD=f=>lvl()>=3||(lvl()==2&&(U.dirs||[]).includes(f));
const canV=f=>lvl()>=3||(!!U&&inF(U,f));
const rl=u=>u.role=='directeur'?'Directeur '+(u.dirs||[]).map(k=>F[k].s).join(' / '):R[u.role]?.[0]||'Salarié';
const uk=u=>u.id.toLowerCase()+(u.g?'-'+u.g:'');
const usr=id=>D.users.find(u=>u.id==id),nm=id=>usr(id)?.name||id;
const bal=f=>D.tx.filter(t=>!f||t.f==f).reduce((a,t)=>a+t.a,0);
const money=n=>n.toLocaleString('fr-FR')+' $';
const pr=m=>m.p==null?'Tarif libre':m.p+' $';
const lu=k=>D.logos[k]||(k=='main'?'img/prestige.png':k=='banner'?'img/banniere.png':F[k].i);
const lg=k=>`<img src="${lu(k)}" alt="">`;
const go=p=>{P=p;FT='pat';editM=null;editG=null;placing=false;if(p!='map')mKeep=false;render();scrollTo(0,0)};
const del=(a,id)=>{if(confirm('Supprimer cet élément ?')){const x=D[a].find(y=>y.id==id);jlog('Suppression · '+({patrols:'fiche de patrouille',events:'événement',news:'annonce',tx:'opération de trésorerie'}[a]||a)+' « '+(x?.c||x?.t||x?.l||'')+' »');D[a]=D[a].filter(y=>y.id!=id);save()}};
const jlog=a=>D.logs.push({id:uid(),t:Date.now(),by:U?.id||'?',a});
const today=()=>new Date().toISOString().slice(0,10);

/* ===== NAVIGATION ===== */
function nav(){
 const it=[['home',U?'Tableau de bord':'Accueil'],['menu','Menu de la Roue des Délices']];
 if(U){Object.keys(F).filter(canV).forEach(k=>it.push([k,F[k].s]));it.push(['map','Carte interactive']);
  if(lvl()>=2)it.push(['adm','Administratif'],['tre','Trésorerie']);if(lvl()>=5)it.push(['ges','Gestion'],['jnl','Journal d’activité'])}
 else{it.push(['login','Connexion salariés']);if(SETUP)it.push(['setup','Première installation'])}
 return it.map(([k,t])=>`<a class="nv${P==k?' on':''}" tabindex=0 onclick="go('${k}')" style="--ac:${F[k]?.c||'#d4b055'}">${F[k]?`<img class=ni src="${lu(k)}" alt="">`:IC[k]||'🔑'} ${t}</a>`).join('')}

function render(){
 if(FB_ON)U=AUTHID?D.users.find(u=>uk(u)==AUTHID)||null:null;else if(U)U=usr(U.id)||null;
 if(U&&(P=='login'||P=='setup'))P='home';
 const need={map:1,adm:2,tre:2,ges:5,jnl:5};
 if(P!='login'&&P!='setup'&&P!='menu'&&P!='home'&&((F[P]&&!canV(P))||(need[P]&&lvl()<need[P])))P=U?'home':'login';
 $('app').innerHTML=`<aside><div class=brand>${lg('main')}Prestige Compagnie</div>${nav()}<div class=sp></div>
 ${U?`<div class=me><b>${e(U.name)}</b><span class=mu>${rl(U)}${U.role!='directeur'&&U.fs.length?' · '+U.fs.map(k=>F[k].s).join(', '):''}</span><br><button class="btn g s" style="margin-top:8px" onclick="logout()">Se déconnecter</button>${FB_ON?' <button class="btn g s" onclick="myPin()">Mon PIN</button>':''}</div>`:''}</aside>
 <main style="--ac:${F[P]?F[P].c:'#d4b055'}">${(PG[P]||PG.home)()}</main>`;
 if(P=='map')mapInit()}

/* ===== PAGES ===== */
const PG={
home(){
 const mine=U?medals(U.id):[];
 return `<div class=ban><img src="${D.logos.banner||'img/banniere.png'}" alt="Prestige Compagnie"></div><div class=hero style="padding-top:8px"><h1>${U?`Bonjour ${e(U.name.split(' ')[0])}.`:'Trois filiales, une seule ville.'}</h1>
 <p class=mu>${U?`Voici l’activité de la compagnie.`:'Trois filiales au service de la ville : balisage, restauration et presse. Consulte nos activités et le menu de la Roue des Délices.'}</p></div>
 <div class=grid>${Object.entries(F).map(([k,f])=>`<div class="card f" style="--ac:${f.c}"><div class=lgo>${lg(k)}</div><h3>${f.n}</h3><p class=mu>${f.d}</p>
 ${canV(k)?`<button class=btn onclick="go('${k}')">Ouvrir la page</button>`:k=='RD'?`<button class="btn g" onclick="go('menu')">Voir le menu</button>`:''}</div>`).join('')}</div>
 ${U?`<h3 class=st>Annonces</h3>${D.news.slice().reverse().map(n=>`<div class=card style="margin-bottom:10px"><b>${e(n.t)}</b><span>${e(n.x)}</span><small>${n.d} · ${e(nm(n.by))}</small></div>`).join('')||'<p class=mu>Aucune annonce pour le moment.</p>'}
 <h3 class=st>Mes médailles</h3><div class=grid>${mine.map(m=>`<div class=card style="flex-direction:row;align-items:center;gap:12px">${medImg(m)}<div><b>${e(m.n)}</b><br><small>${e(m.desc)}</small><br><small>${e(m.e)} · ${m.d}</small></div></div>`).join('')||'<p class=mu>Aucune médaille reçue pour l’instant.</p>'}</div>`:''}`},

menu(){
 const cats=[...new Set(D.menu.map(m=>m.c))];
 return `<div class=ph><div class=lgo>${lg('RD')}</div><div><h2>Menu de la Roue des Délices</h2><p class=mu>L’excellence au pas de votre porte</p></div></div>
 <div class=grid style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start">${cats.map(c=>`<div class="card f" style="--ac:${F.RD.c};gap:2px"><h3 style="margin-bottom:6px">${e(c)}</h3>${D.menu.filter(m=>m.c==c).map(m=>`<div class=mi${m.out?' style="opacity:.55"':''}><span${m.out?' style="text-decoration:line-through"':''}>${e(m.n)}</span>${m.out?'<span class=pill style="--ac:#f87171">Rupture de stock</span>':`<b>${pr(m)}</b>`}</div>`).join('')}</div>`).join('')||'<p class=mu>Le menu arrive bientôt.</p>'}</div>`},

login(){return `<form class="card login" onsubmit="doLogin(event)"><div class=lgo style="width:110px;height:110px;margin:0 auto 6px">${lg('main')}</div><h2>Connexion</h2><p class=mu>Espace réservé aux salariés.</p>
 <label>Identifiant</label><input id=li placeholder="Ex : S.Mouveau" autocomplete=username required>
 <label>Code PIN</label><input id=lp type=password autocomplete=current-password required><button class=btn>Se connecter</button></form>`},

setup(){return `<form class="card login" onsubmit="doSetup(event)"><h2>Première installation</h2><p class=mu>Crée le compte administrateur. Cet écran disparaît ensuite.</p>
 <label>Nom complet</label><input id=sn oninput="$('si').value=genId(this.value)" required><label>Identifiant</label><input id=si required>
 <label>PIN (4 caractères minimum)</label><input id=sp type=password minlength=4 required><button class=btn>Créer l’administrateur</button></form>`},

map(){const m=gm(),ev=D.events.filter(x=>x.x!=null&&(x.mp||'base')==m.id).sort((a,b)=>b.d.localeCompare(a.d)),dir=lvl()>=2;
 return `<div class=ph><h2>Carte interactive</h2></div>
 <div class="card row" style="margin-bottom:12px;align-items:end"><div><label>Carte</label><select onchange="curMap=this.value;mKeep=false;placing=false;render()">${MAPS().map(x=>`<option value="${x.id}"${x.id==m.id?' selected':''}>${e(x.name)}</option>`).join('')}</select></div>
 <span class=mu style="flex:3">Molette ou pincement pour zoomer, glisser pour se déplacer. ${dir?'Clique « Poser un événement » puis un point de la carte.':''}</span>
 ${dir?`<button class="btn${placing?'':' g'}" onclick="placing=!placing;render()">${placing?'Annuler la pose':'📍 Poser un événement'}</button>`:''}
 <button class="btn g" onclick="mapFit()">Recentrer</button></div>
 <div class=two style="grid-template-columns:1fr 260px"><div id=mv${placing?' style="cursor:crosshair"':''}><div id=mw style="height:${mapH()}px"><img src="${m.img}" alt="Carte" onerror="this.style.display='none'">
 ${ev.map(x=>`<div class=mk style="left:${x.x}%;top:${x.y}%" title="${e(x.t)}" onpointerup="info('${x.id}')"><img src="${lu(x.f)}" alt=""></div>`).join('')}</div></div>
 <div id=inf class=card><h4>Événements</h4>${ev.map(x=>`<a class=nv style="--ac:${F[x.f].c}" onclick="info('${x.id}')"><img class=ni src="${lu(x.f)}" alt=""> ${e(x.t)}</a>`).join('')||'<p class=mu>Aucun événement sur cette carte.</p>'}</div></div>
 ${dir?`<h3 class=st>Ajouter une carte personnalisée</h3><form class="card row" onsubmit="addMap(event)"><div><label>Nom</label><input id=mnm required placeholder="Ex : Balisage course du 12"></div>
 <div><label>Image à importer (PNG ou JPG)</label><input id=mfl type=file accept="image/*"></div><div style="flex:2"><label>…ou chemin / lien de l’image (qualité maximale)</label><input id=mur placeholder="maps/course.jpg"></div><button class=btn>Ajouter la carte</button></form>
 <p class=mu style="margin-top:8px">Qualité maximale : mets ton image Canva exportée dans un dossier <b>maps</b> de ton GitHub, puis indique son chemin (ex : maps/course.jpg).</p>
 ${m.id!='base'?`<button class="btn g s" style="margin-top:10px" onclick="delMap('${m.id}')">Supprimer la carte « ${e(m.name)} »</button>`:''}`:''}`},

adm(){
 return `<div class=ph><h2>Administratif</h2></div><div class=grid>${Object.entries(F).filter(([k])=>canD(k)).map(([k,f])=>`<div class="card f" style="--ac:${f.c}"><h3>${f.s}</h3>
 <span>${D.users.filter(u=>inF(u,k)).length} membres</span><span>${D.patrols.filter(p=>p.f==k&&p.st=='En service').length} patrouille(s) en service</span>
 <span>${D.events.filter(x=>x.f==k).length} événement(s)</span><b>Solde : ${money(bal(k))}</b></div>`).join('')}</div>
 <h3 class=st>Publier une annonce</h3><form class=card onsubmit="addNews(event)"><label>Titre</label><input id=nt required><label>Message</label><input id=nx required><button class=btn>Publier</button></form>
 ${D.news.slice().reverse().map(n=>`<div class="card row" style="margin-top:10px"><div><b>${e(n.t)}</b><br><small>${n.d} · ${e(nm(n.by))}</small></div><button class="btn g s" onclick="del('news','${n.id}')">Supprimer</button></div>`).join('')}`},

tre(){
 const fs=lvl()>=3?Object.keys(F):(U.dirs||[]);
 const tx=D.tx.filter(t=>fs.includes(t.f)).sort((a,b)=>b.t-a.t).slice(0,80);
 return `<div class=ph><h2>Trésorerie</h2></div><div class=grid>
 ${lvl()>=3?`<div class="card f"><span class=mu>Solde global</span><div class=kpi>${money(bal())}</div></div>`:''}
 ${fs.map(k=>`<div class="card f" style="--ac:${F[k].c}"><span class=mu>${F[k].s}</span><div class=kpi>${money(bal(k))}</div></div>`).join('')}</div>
 <h3 class=st>Nouvelle opération</h3><form class="card row" onsubmit="addTx(event)">
 <div><label>Filiale</label><select id=xf>${fs.map(k=>`<option value=${k}>${F[k].s}</option>`).join('')}</select></div>
 <div><label>Type</label><select id=xs><option value=1>Recette</option><option value=-1>Dépense</option></select></div>

async function doLogin(ev){ev.preventDefault();

 const u=D.users.find(x=>x.id.toLowerCase()==v('li').toLowerCase()&&x.pin==v('lp'));
 if(!u)return alert('Identifiant ou PIN incorrect.');U=u;try{sessionStorage.s=u.id}catch(x){}go('home')}

async function doSetup(ev){ev.preventDefault();const id=v('si');if(!/^[A-Za-z0-9._-]+$/.test(id))return alert('Identifiant : lettres, chiffres, point et tiret uniquement.');
 try{await FBX.setup(v('sn'),id,v('sp'));P='home';render()}catch(x){alert('Échec : '+(x.code||x.message))}}

 fin=img=>{it.n=v('en');it.q=parseInt(v('eq'))||0;if(img)it.img=img;jlog('Matériel : « '+it.n+' » modifié dans « '+g.name+' »');editG=null;save()};fl?readImg(fl,192,fin):fin('')}

 return `<form class="card row" onsubmit="addMenu(event)"><div style="flex:2"><label>${m?'Modifier le produit':'Produit'}</label><input id=mn value="${e(m?.n||'')}" required></div>
 <div><label>Prix</label><input id=mp type=number step=any value="${m&&!fr?m.p:''}" ${fr?'disabled':'required'}></div>
 <div><label>Tarif libre</label><select id=mf onchange="$('mp').disabled=this.value=='1';$('mp').required=this.value!='1'"><option value=0>Non</option><option value=1${fr?' selected':''}>Oui</option></select></div>
 <div><label>Catégorie</label><input id=mc list=mcats value="${e(m?.c||'Douceurs')}" required><datalist id=mcats>${cats.map(c=>`<option value="${e(c)}">`).join('')}</datalist></div>
 <button class=btn>${m?'Enregistrer':'Ajouter'}</button>${m?`<button type=button class="btn g" onclick="editM=null;render()">Annuler</button>`:''}</form>`}
function addMenu(ev){ev.preventDefault();const o={n:v('mn'),p:v('mf')=='1'?null:parseFloat(v('mp')),c:v('mc')};
 if(editM!=null){Object.assign(D.menu[editM],o);jlog('Menu : « '+o.n+' » modifié');editM=null}else{D.menu.push(o);jlog('Menu : « '+o.n+' » ajouté')}save()}

function addNews(ev){ev.preventDefault();D.news.push({id:uid(),t:v('nt'),x:v('nx'),d:new Date().toLocaleDateString('fr-FR'),by:U.id});jlog('Annonce publiée : « '+v('nt')+' »');save()}
function addTx(ev){ev.preventDefault();const f=v('xf');if(!canD(f))return;
 D.tx.push({id:uid(),f,a:parseFloat(v('xa'))*parseInt(v('xs')),l:v('xl'),d:new Date().toLocaleDateString('fr-FR'),by:U.id,t:Date.now()});jlog('Trésorerie '+F[f].s+' : '+(parseFloat(v('xa'))*parseInt(v('xs')))+' $ — '+v('xl'));save()}
const genId=n=>{const p=n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z\s-]/g,'').trim().split(/\s+/);return p[0]?p[0][0].toUpperCase()+(p.length>1?'.'+p.slice(1).join(''):''):''};
const roleOpts=()=>[['president','Président'],['vp','Vice-Président'],...Object.keys(F).map(k=>['dir:'+k,'Directeur '+F[k].s]),['salarie','Salarié']];
const roleKey=u=>u.role=='directeur'?'dir:'+((u.dirs||[])[0]||''):u.role;
function applyRole(u,key){if(key.startsWith('dir:')){u.role='directeur';u.dirs=[key.slice(4)]}else{u.role=key;u.dirs=[]}}
async function saveUser(ev){ev.preventDefault();const fs=[...document.querySelectorAll('.fc:checked')].map(c=>c.value);
 if(editU){const u=usr(editU),self=U&&u.id==U.id;u.name=v('un');u.grade=v('ug')||'Salarié';
  applyRole(u,v('ur'));if(!self)u.admin=$('ua').checked
  u.fs=fs;(u.dirs||[]).forEach(k=>{if(!u.fs.includes(k))u.fs.push(k)});editU=null;jlog('Compte modifié : '+u.name);return save()}
 const id=v('ui');if(D.users.some(x=>x.id.toLowerCase()==id.toLowerCase()))return alert('Cet identifiant existe déjà.');
 if(!/^[A-Za-z0-9._-]+$/.test(id))return alert('Identifiant : lettres, chiffres, point et tiret uniquement.');
 const u={id,name:v('un'),role:'salarie',dirs:[],fs,admin:$('ua').checked,grade:v('ug')||'Salarié'};applyRole(u,v('ur'));u.dirs.forEach(k=>{if(!u.fs.includes(k))u.fs.push(k)});
 if(FB_ON){if(v('up').length<4)return alert('PIN : 4 caractères minimum.');
  try{const g=await FBX.createAccount(id,v('up'));if(g)u.g=g}catch(x){return alert(x.code=='auth/email-already-in-use'?'Ce compte existe déjà dans Firebase (ancien compte supprimé ?). Choisis un autre identifiant.':'Création impossible : '+(x.code||x.message))}}
 else u.pin=v('up');
 D.users.push(u);jlog('Compte créé : '+u.name+' ('+u.id+')');save()}
async function resetPin(id){const u=usr(id);if(!u||!confirm('Générer un nouveau PIN pour '+u.name+' ? L’ancien ne fonctionnera plus.'))return;
 const pin=String(Math.floor(1000+Math.random()*9000));
 if(FB_ON){try{const g=await FBX.createAccount(u.id,pin);u.g=g||undefined}catch(x){return alert('Échec : '+(x.code||x.message))}}else u.pin=pin;
 jlog('Nouveau PIN généré pour '+u.name);save();prompt('Nouveau PIN de '+u.name+' — copie-le et transmets-le :',pin)}
function chPin(id){const p=prompt('Nouveau PIN pour '+id);if(p){usr(id).pin=p;save()}}
function delUser(id){if(confirm('Supprimer le compte '+id+' ?')){jlog('Compte supprimé : '+nm(id)+' ('+id+')');D.users=D.users.filter(u=>u.id!=id);save()}}
function setLogo(k,inp){const fl=inp.files[0];if(!fl)return;const im=new Image();im.onload=()=>{const s=Math.min(1,(k=='banner'?1000:256)/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.logos[k]=c.toDataURL('image/png');jlog('Logo modifié : '+k);save()};im.src=URL.createObjectURL(fl)}
function exportJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='prestige-sauvegarde-'+today()+'.json';a.click()}
function importJ(inp){const r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save()}catch(x){alert('Fichier invalide.')}};r.readAsText(inp.files[0])}

/* ===== CARTE (zoom + déplacement) ===== */
let mS=1,mX=0,mY=0;
const BASE={id:'base',name:'Vice City',img:'map.jpg',r:1},MAPS=()=>[BASE,...D.maps],gm=()=>MAPS().find(m=>m.id==curMap)||BASE,mapH=()=>2000*gm().r;
function mapFit(){const v=$('mv'),H=mapH();mS=Math.min(v.clientWidth/2000,v.clientHeight/H);mX=(v.clientWidth-2000*mS)/2;mY=(v.clientHeight-H*mS)/2;mApply()}
function addMap(ev){ev.preventDefault();const fl=$('mfl').files[0],nm=v('mnm'),url=v('mur');
 if(!fl&&!url)return alert('Choisis une image ou indique son chemin.');
 const fin=(img,q)=>{D.maps.push({id:uid(),name:nm,img,r:+q.toFixed(4),by:U.id});jlog('Carte ajoutée : '+nm);curMap=D.maps[D.maps.length-1].id;mKeep=false;save()},im=new Image();
 if(url){im.onload=()=>fin(url,im.naturalHeight/im.naturalWidth);im.onerror=()=>alert('Image introuvable : vérifie le chemin ou le nom du fichier.');im.src=url;return}
 im.onload=()=>{const s=Math.min(1,2600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
  let q=.88,d=c.toDataURL('image/jpeg',q);while(d.length>880000&&q>.3){q-=.08;d=c.toDataURL('image/jpeg',q)}
  if(d.length>950000)return alert('Image trop lourde pour l’import direct : utilise le chemin d’un fichier dans ton GitHub.');
  fin(d,c.height/c.width)};im.src=URL.createObjectURL(fl)}
function delMap(id){if(confirm('Supprimer cette carte et les événements posés dessus ?')){jlog('Carte supprimée : '+gm().name);D.maps=D.maps.filter(m=>m.id!=id);D.events=D.events.filter(x=>x.mp!=id);curMap='base';mKeep=false;save()}}
function mApply(){const w=$('mw');w.style.transform=`translate(${mX}px,${mY}px) scale(${mS})`;w.style.setProperty('--k',Math.min(1,.6/mS*.5+.2))}
function info(id){const x=D.events.find(y=>y.id==id);if(!x||moved>6)return;
 $('inf').innerHTML=`<h4>${e(x.t)}</h4><small>${F[x.f].n} · ${x.d}</small>${x.m?`<span>🏅 ${e(medName(x.m))}</span>`:''}${x.aw?.length?`<span>${x.aw.map(i=>e(nm(i))).join(', ')}</span>`:''}
 <button class="btn g s" onclick="render()">Retour à la liste</button>${canD(x.f)?`<button class="btn g s" onclick="del('events','${x.id}')">Supprimer</button>`:''}`}
let moved=0;
function mapInit(){const v=$('mv');let drag=null,pts={},pd=0;mKeep?mApply():(mapFit(),mKeep=true);
 v.onwheel=ev=>{ev.preventDefault();zoom(ev.clientX,ev.clientY,ev.deltaY<0?1.2:1/1.2)};
 const zoom=(cx,cy,f)=>{const r=v.getBoundingClientRect(),ns=Math.max(Math.min(v.clientWidth/2000,v.clientHeight/mapH())*.8,Math.min(3,mS*f)),mx=cx-r.left,my=cy-r.top;mX=mx-(mx-mX)*ns/mS;mY=my-(my-mY)*ns/mS;mS=ns;mApply()};
 v.onpointerdown=ev=>{v.setPointerCapture(ev.pointerId);pts[ev.pointerId]=ev;moved=0;drag={x:ev.clientX,y:ev.clientY};pd=0};
 v.onpointermove=ev=>{if(!pts[ev.pointerId])return;const ids=Object.keys(pts);
  if(ids.length==2){const o=pts[ids.find(i=>i!=ev.pointerId)],d=Math.hypot(ev.clientX-o.clientX,ev.clientY-o.clientY);if(pd)zoom((ev.clientX+o.clientX)/2,(ev.clientY+o.clientY)/2,d/pd);pd=d;pts[ev.pointerId]=ev;moved=99;return}
  pts[ev.pointerId]=ev;mX+=ev.clientX-drag.x;mY+=ev.clientY-drag.y;moved+=Math.abs(ev.clientX-drag.x)+Math.abs(ev.clientY-drag.y);drag={x:ev.clientX,y:ev.clientY};mApply()};
 v.onpointerup=ev=>{delete pts[ev.pointerId];pd=0;if(moved<6&&placing&&!ev.target.closest('.mk')){const r=v.getBoundingClientRect(),x=(ev.clientX-r.left-mX)/mS/20,y=(ev.clientY-r.top-mY)/mS/(mapH()/100);
  const t=prompt('Titre de l’événement ?');if(t){const f=canD('BRB')?'BRB':(U.dirs||[])[0]||'BRB';D.events.push({id:uid(),f,t,d:today(),m:'',aw:[],mp:curMap,x:+x.toFixed(2),y:+y.toFixed(2)});jlog('Événement « '+t+' » posé sur la carte')}placing=false;save()}}}
render();
</script>

<script type="module">
const C=window.FIREBASE_CONFIG;
if(C){
const B='https://www.gstatic.com/firebasejs/10.12.2/';
const {initializeApp}=await import(B+'firebase-app.js'),A=await import(B+'firebase-auth.js'),S=await import(B+'firebase-firestore.js');
const app=initializeApp(C),auth=A.getAuth(app),db=S.getFirestore(app);
const COLS=['users','patrols','events','tx','news','maps','medals','sales','logs','gear'],em=id=>id.toLowerCase()+'@prestige-compagnie.com',pw=p=>p+'#Prestige';
const key=(c,x)=>c=='users'?uk(x):x.id;
let snap={},unsubs=[],loaded={},ready=false,cfgJ='',settingUp=false,sec=null;
const fail=x=>{console.warn(x);alert('Action refusée par le serveur ('+(x.code||'erreur')+').')};
const cfgOf=()=>JSON.stringify({veh:D.veh,menu:D.menu,logos:D.logos});

/* Données publiques : menu, véhicules, logos */
S.onSnapshot(S.doc(db,'cfg','main'),d=>{const x=d.data();if(x){D.veh={BRB:[],RD:[],PR:[],...(x.veh||{})};D.menu=x.menu||[];D.logos=x.logos||{};cfgJ=cfgOf()}softRender()},()=>{});
try{SETUP=!(await S.getDoc(S.doc(db,'meta','init'))).exists()}catch(x){}

function listen(u){unsubs.forEach(f=>f());unsubs=[];loaded={};ready=false;AUTHID=u.email.split('@')[0];
 const done=c=>{loaded[c]=1;ready=COLS.every(k=>loaded[k]);if(ready&&!D.users.find(x=>uk(x)==AUTHID))A.signOut(auth)};
 COLS.forEach(c=>unsubs.push(S.onSnapshot(S.collection(db,c),qs=>{snap[c]={};D[c]=qs.docs.map(d=>{const x0=d.data(),x=c=='users'?norm(x0):x0;snap[c][d.id]=JSON.stringify(x);return x});done(c);softRender()},err=>{D[c]=[];snap[c]={};done(c)})))}
A.onAuthStateChanged(auth,u=>{if(settingUp)return;
 if(!u){unsubs.forEach(f=>f());unsubs=[];ready=false;AUTHID=null;COLS.forEach(c=>D[c]=[]);snap={};render();return}
 listen(u)});

/* Envoie uniquement ce qui a changé */
function sync(){if(!ready)return;
 for(const c of COLS){const nw={},old=snap[c]||{};D[c].forEach(x=>nw[key(c,x)]=x);
  for(const k in nw){const j=JSON.stringify(nw[k]);if(old[k]!==j){old[k]=j;S.setDoc(S.doc(db,c,k),JSON.parse(j)).catch(fail)}}
  for(const k in old)if(!(k in nw)){delete old[k];S.deleteDoc(S.doc(db,c,k)).catch(fail)}
  snap[c]=old}
 const cj=cfgOf();if(cj!==cfgJ){cfgJ=cj;S.setDoc(S.doc(db,'cfg','main'),JSON.parse(cj)).catch(fail)}}

window.FBX={sync,
 login:async(id,pin)=>{const b=id.toLowerCase();let g=0;try{const d=await S.getDoc(S.doc(db,'meta','gens'));g=(d.exists()&&d.data()[b])||0}catch(x){}
  return A.signInWithEmailAndPassword(auth,em(b+(g?'-'+g:'')),pw(pin))},
 logout:()=>A.signOut(auth),
 async createAccount(id,pin){sec=sec||A.getAuth(initializeApp(C,'sec'));const b=id.toLowerCase(),gd=await S.getDoc(S.doc(db,'meta','gens')),cur=gd.exists()?gd.data()[b]:undefined;
  let g=cur==null?0:cur+1;
  for(;;g++){try{await A.createUserWithEmailAndPassword(sec,em(b+(g?'-'+g:'')),pw(pin));await A.signOut(sec);break}catch(x){if(x.code!='auth/email-already-in-use'||g>30)throw x}}
  if(g)await S.setDoc(S.doc(db,'meta','gens'),{[b]:g},{merge:true});return g},
 setPin:p=>A.updatePassword(auth.currentUser,pw(p)),
 async setup(name,id,pin){settingUp=true;try{
   await A.createUserWithEmailAndPassword(auth,em(id),pw(pin));
   await S.setDoc(S.doc(db,'users',id.toLowerCase()),{id,name,role:'salarie',admin:true,fs:[],dirs:[],grade:'Administrateur'});
   await S.setDoc(S.doc(db,'meta','init'),{t:Date.now()});
   const sd=seed();await S.setDoc(S.doc(db,'cfg','main'),{veh:sd.veh,menu:sd.menu,logos:{}})}
  finally{settingUp=false}
  SETUP=false;listen(auth.currentUser)}};
}
render();
</script>
